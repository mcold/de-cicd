services:
  cbdb-segment-host-1:
    container_name: cbdb-sdw1
    image: mcold/cbdb:1.6.0-rockylinux9
    hostname: sdw1
    tty: true
    networks:
      interconnect:
        ipv4_address: 10.5.0.12
  cbdb-segment-host-2:
    container_name: cbdb-sdw2
    image: mcold/cbdb:1.6.0-rockylinux9
    hostname: sdw2
    tty: true
    networks:
      interconnect:
        ipv4_address: 10.5.0.13
  cbdb-coordinator:
    container_name: cbdb-cdw3
    image: mcold/cbdb:1.6.0-rockylinux9
    ports:
    - "15432:5432"
    hostname: cdw
    tty: true
    networks:
      interconnect:
        ipv4_address: 10.5.0.10
    environment:
      MULTINODE: "true"
  cbdb-standby-coordinator:
    container_name: cbdb-scdw
    image: mcold/cbdb:1.6.0-rockylinux9
    hostname: scdw
    tty: true
    networks:
      interconnect:
        ipv4_address: 10.5.0.11

networks:
  interconnect:
    name: cbdb-interconnect
    driver: bridge
    ipam:
     config:
       - subnet: 10.5.0.0/16
         gateway: 10.5.0.1
